user                            www;
worker_processes                auto; # it will be determinate automatically by the number of core

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    on;
    access_log                  /var/log/nginx/access.log;
    client_max_body_size 2G;
    server {
        listen 5000;
        server_name _;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Claude connects to /api/mcp-oauth-dynamic and only accepts discovery
        # documents whose resource/issuer is that same URL. The API advertises
        # the URL without /api, so these exact paths answer Claude directly.
        location = /.well-known/oauth-protected-resource/mcp-oauth-dynamic {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "max-age=300" always;
            return 200 '{"resource":"https://dashboard.aizyntra.com/api/mcp-oauth-dynamic","authorization_servers":["https://dashboard.aizyntra.com/api/mcp-oauth-dynamic"],"scopes_supported":["mcp:read","mcp:write"],"bearer_methods_supported":["header"]}';
        }

        location = /.well-known/oauth-protected-resource/api/mcp-oauth-dynamic {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "max-age=300" always;
            return 200 '{"resource":"https://dashboard.aizyntra.com/api/mcp-oauth-dynamic","authorization_servers":["https://dashboard.aizyntra.com/api/mcp-oauth-dynamic"],"scopes_supported":["mcp:read","mcp:write"],"bearer_methods_supported":["header"]}';
        }

        location = /.well-known/oauth-authorization-server/mcp-oauth-dynamic {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "max-age=300" always;
            return 200 '{"issuer":"https://dashboard.aizyntra.com/mcp-oauth-dynamic","authorization_endpoint":"https://dashboard.aizyntra.com/oauth/authorize","token_endpoint":"https://dashboard.aizyntra.com/api/oauth/token","registration_endpoint":"https://dashboard.aizyntra.com/api/oauth/register","response_types_supported":["code"],"grant_types_supported":["authorization_code"],"token_endpoint_auth_methods_supported":["client_secret_basic","client_secret_post","none"],"code_challenge_methods_supported":["S256"],"scopes_supported":["mcp:read","mcp:write"]}';
        }

        location = /.well-known/oauth-authorization-server/api/mcp-oauth-dynamic {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "max-age=300" always;
            return 200 '{"issuer":"https://dashboard.aizyntra.com/api/mcp-oauth-dynamic","authorization_endpoint":"https://dashboard.aizyntra.com/oauth/authorize","token_endpoint":"https://dashboard.aizyntra.com/api/oauth/token","registration_endpoint":"https://dashboard.aizyntra.com/api/oauth/register","response_types_supported":["code"],"grant_types_supported":["authorization_code"],"token_endpoint_auth_methods_supported":["client_secret_basic","client_secret_post","none"],"code_challenge_methods_supported":["S256"],"scopes_supported":["mcp:read","mcp:write"]}';
        }

        location = /.well-known/oauth-authorization-server {
            default_type application/json;
            add_header Access-Control-Allow-Origin * always;
            add_header Cache-Control "max-age=300" always;
            return 200 '{"issuer":"https://dashboard.aizyntra.com","authorization_endpoint":"https://dashboard.aizyntra.com/oauth/authorize","token_endpoint":"https://dashboard.aizyntra.com/api/oauth/token","registration_endpoint":"https://dashboard.aizyntra.com/api/oauth/register","response_types_supported":["code"],"grant_types_supported":["authorization_code"],"token_endpoint_auth_methods_supported":["client_secret_basic","client_secret_post","none"],"code_challenge_methods_supported":["S256"],"scopes_supported":["mcp:read","mcp:write"]}';
        }

        # Claude's fallback when discovery does not yield a registration_endpoint.
        location = /register {
            proxy_pass http://localhost:3000/oauth/register;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OAuth discovery (Claude/MCP) requests these on the site root.
        # They must reach the API; the frontend auth gate would redirect them to /auth.
        location /.well-known/oauth-protected-resource {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known/oauth-authorization-server {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known/openid-configuration {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://localhost:3000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
        }

        location /uploads/ {
            alias /uploads/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
            types {
                image/jpeg jpg jpeg;
                image/png png;
                image/gif gif;
                image/webp webp;
                image/avif avif;
                image/bmp bmp;
                image/tiff tif tiff;
                video/mp4 mp4;
            }
            default_type application/octet-stream;
        }

        location / {
            proxy_pass http://localhost:4200/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Reload $http_reload;
            proxy_set_header Onboarding $http_onboarding;
            proxy_set_header Activate $http_activate;
            proxy_set_header Auth $http_auth;
            proxy_set_header Showorg $http_showorg;
            proxy_set_header Impersonate $http_impersonate;
            proxy_set_header Accept-Language $http_accept_language;
            proxy_set_header i18next $http_i18next;
        }
    }
}